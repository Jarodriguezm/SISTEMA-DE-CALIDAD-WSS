name: Respaldo diario

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  respaldo:
    name: Volcado de PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Generar respaldo
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          if [ -z "$DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL"
            exit 1
          fi
          FECHA=$(date +%Y-%m-%d)
          mkdir -p respaldo
          echo "Volcando esquema..."
          pg_dump "$DB_URL" --schema-only --no-owner --no-privileges > "respaldo/esquema_${FECHA}.sql"
          echo "Volcando datos..."
          pg_dump "$DB_URL" --data-only --no-owner --no-privileges --exclude-table-data='storage.*' --exclude-table-data='auth.*' > "respaldo/datos_${FECHA}.sql"
          gzip respaldo/*.sql
          ls -lh respaldo/

      - name: Guardar respaldo
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-wss-${{ github.run_number }}
          path: respaldo/
          retention-days: 90

      - name: Resumen
        run: |
          echo "### Respaldo completado" >> $GITHUB_STEP_SUMMARY
          echo "Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Descargable desde Artifacts durante 90 dias." >> $GITHUB_STEP_SUMMARY
